name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job reçoit seulement ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Build Astro pur : chiffres, CV PDF et image OG sont générés en local (pnpm snapshot) et commités.
      # Action tierce épinglée sur un commit : un tag peut être déplacé.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          node-version: 24
          package-manager: pnpm@10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
